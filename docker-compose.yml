version: "3.9"

services:
  mongo:
    image: mongo:7
    container_name: rpi-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  backend:
    build: ./backend
    container_name: rpi-backend
    restart: unless-stopped
    depends_on:
      - mongo
    environment:
      - PORT=5000
      - MONGO_URI=mongodb://mongo:27017/rental_price_intelligence
      - CLIENT_ORIGIN=http://localhost:5173
      - ALERT_THRESHOLD_PERCENT=12
    ports:
      - "5000:5000"

  frontend:
    build: ./frontend
    container_name: rpi-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  mongo_data:
